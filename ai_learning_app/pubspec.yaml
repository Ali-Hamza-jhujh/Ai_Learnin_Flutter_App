name: study_app
description: Lumio - AI-powered study companion
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^6.2.1
  device_info_plus: ^11.3.3
  file_picker: ^8.0.3
  flutter_tts: ^4.2.2
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  animate_do: ^3.3.4
  lottie: ^3.1.2
  crypto: ^3.0.6
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.4
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.7.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#050818"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
